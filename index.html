<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フィードバック管理ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #2d3748; min-height: 100vh; }
  header { background: #2b6cb0; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab { padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all .2s; background: white; color: #4a5568; border: 1px solid #cbd5e0; }
  .tab.active { background: #2b6cb0; color: white; border-color: #2b6cb0; }
  .tab.admin-tab { color: #744210; border-color: #f6ad55; }
  .tab.admin-tab.active { background: #c05621; color: white; border-color: #c05621; }
  .tab.base-tab { font-size: .82rem; padding: 6px 14px; color: #2c7a7b; border-color: #81e6d9; }
  .tab.base-tab.active { background: #2c7a7b; color: white; border-color: #2c7a7b; }
  .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 20px; }
  .card h2 { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: #2b6cb0; border-bottom: 2px solid #ebf4ff; padding-bottom: 8px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.82rem; font-weight: 600; color: #4a5568; }
  input, select, textarea { border: 1px solid #cbd5e0; border-radius: 6px; padding: 8px 10px; font-size: 0.92rem; width: 100%; outline: none; transition: border .2s; }
  input:focus, select:focus, textarea:focus { border-color: #2b6cb0; }
  textarea { resize: vertical; min-height: 80px; }
  .btn { padding: 9px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.92rem; font-weight: 600; transition: all .2s; }
  .btn-primary { background: #2b6cb0; color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-danger { background: #e53e3e; color: white; }
  .btn-success { background: #38a169; color: white; }
  .btn-warning { background: #c05621; color: white; }
  .btn-sm { padding: 5px 12px; font-size: 0.82rem; }
  .filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .filter-row .form-group { flex: 1; min-width: 120px; }
  .feedback-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .fb-card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; border-left: 4px solid #2b6cb0; }
  .fb-card.done { border-left-color: #38a169; opacity: .85; }
  .fb-card-header { padding: 12px 14px; background: #ebf8ff; display: flex; justify-content: space-between; align-items: center; }
  .fb-card.done .fb-card-header { background: #f0fff4; }
  .fb-num { font-weight: 800; color: #2b6cb0; font-size: 1rem; }
  .fb-date { font-size: 0.78rem; color: #718096; }
  .fb-card-body { padding: 12px 14px; }
  .fb-base { display: inline-block; background: #2b6cb0; color: white; border-radius: 4px; font-size: .75rem; padding: 2px 8px; margin-bottom: 8px; }
  .fb-content { font-size: .9rem; color: #2d3748; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
  .fb-img { width: calc(50% - 3px); border-radius: 6px; max-height: 140px; object-fit: cover; cursor: pointer; }
  .fb-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .base-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .base-tag { display: flex; align-items: center; gap: 6px; background: #ebf4ff; border-radius: 20px; padding: 4px 12px; font-size: .85rem; }
  .base-tag span { color: #2b6cb0; font-weight: 600; }
  .add-base-row { display: flex; gap: 8px; }
  .empty { text-align: center; color: #a0aec0; padding: 40px; font-size: .95rem; }
  .img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000; align-items: center; justify-content: center; }
  .img-modal.open { display: flex; }
  .img-modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  .img-modal-close { position: absolute; top: 16px; right: 24px; color: white; font-size: 2rem; cursor: pointer; font-weight: bold; }
  .count-badge { background: #e2e8f0; border-radius: 20px; padding: 2px 10px; font-size: .8rem; color: #4a5568; }
  .loading { text-align: center; color: #718096; padding: 40px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #cbd5e0; border-top-color: #2b6cb0; border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #2d3748; color: white; padding: 10px 20px; border-radius: 8px; font-size: .9rem; opacity: 0; transition: opacity .3s; z-index: 2000; }
  .toast.show { opacity: 1; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 800; color: #2b6cb0; }
  .stat-label { font-size: .82rem; color: #718096; margin-top: 4px; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-box { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chart-box h3 { font-size: .9rem; font-weight: 700; color: #4a5568; margin-bottom: 12px; }
  .pw-box { max-width: 360px; margin: 60px auto; text-align: center; }
  .pw-box h2 { font-size: 1.1rem; margin-bottom: 16px; color: #c05621; }
  .lock-icon { font-size: 3rem; margin-bottom: 12px; }
  @media(max-width:600px) { .form-grid { grid-template-columns: 1fr; } .filter-row { flex-direction: column; } .chart-grid { grid-template-columns: 1fr; } }

  /* ===== マニュアルボタン ===== */
  .manual-wrap { position: relative; }
  .manual-btn {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.18); color: white;
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 8px; padding: 7px 14px;
    font-size: 0.88rem; font-weight: 700; cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .manual-btn:hover { background: rgba(255,255,255,0.28); }
  .manual-btn svg { flex-shrink: 0; }
  .manual-dropdown {
    display: none; position: absolute; top: calc(100% + 8px); right: 0;
    background: white; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,.18);
    min-width: 240px; z-index: 500; overflow: hidden;
  }
  .manual-dropdown.open { display: block; }
  .manual-dropdown-header {
    background: #ebf4ff; padding: 10px 14px;
    font-size: .8rem; font-weight: 700; color: #2b6cb0;
    border-bottom: 1px solid #bee3f8;
  }
  .manual-dropdown-empty { padding: 18px 14px; color: #a0aec0; font-size: .88rem; text-align: center; }
  .manual-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; text-decoration: none; color: #2d3748;
    font-size: .9rem; border-bottom: 1px solid #f0f4f8;
    transition: background .15s;
  }
  .manual-item:last-child { border-bottom: none; }
  .manual-item:hover { background: #f0f4f8; }
  .manual-item-icon { font-size: 1rem; flex-shrink: 0; }
  .manual-item-title { font-weight: 600; flex: 1; }

  /* ===== 管理者：マニュアル管理 ===== */
  .manual-admin-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .manual-admin-row {
    display: flex; align-items: center; gap: 8px;
    background: #f7fafc; border-radius: 8px; padding: 10px 12px;
  }
  .manual-admin-row .manual-title-col { font-weight: 700; font-size: .9rem; color: #2b6cb0; min-width: 120px; }
  .manual-admin-row .manual-url-col { font-size: .82rem; color: #718096; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-manual-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; margin-top: 4px; }
  @media(max-width:600px) { .add-manual-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
  <h1>フィードバック管理ツール</h1>

  <!-- マニュアルボタン -->
  <div class="manual-wrap">
    <button class="manual-btn" onclick="toggleManualDropdown(event)" id="manual-toggle-btn">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      📖 マニュアル
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div class="manual-dropdown" id="manual-dropdown">
      <div class="manual-dropdown-header">📚 マニュアル一覧</div>
      <div id="manual-dropdown-body"><div class="manual-dropdown-empty">読み込み中...</div></div>
    </div>
  </div>
</header>

<div class="container">
  <!-- メインタブ -->
  <div class="tabs" id="main-tabs">
    <button class="tab active" onclick="showTab('list')">📋 一覧</button>
    <button class="tab" onclick="showTab('input')">➕ 入力</button>
    <button class="tab" onclick="showTab('settings')">⚙️ 拠点設定</button>
    <button class="tab admin-tab" onclick="showTab('admin')">🔐 管理者</button>
  </div>
  <!-- 拠点タブ -->
  <div class="tabs" id="base-tabs" style="margin-bottom:20px;"></div>

  <!-- 一覧 -->
  <div id="tab-list">
    <div class="card">
      <h2>🔍 絞り込み</h2>
      <div class="filter-row">
        <div class="form-group"><label>拠点</label><select id="filter-base" onchange="renderList()"><option value="">すべて</option></select></div>
        <div class="form-group"><label>対応者</label><select id="filter-person" onchange="renderList()"><option value="">すべて</option></select></div>
        <div class="form-group"><label>ステータス</label>
          <select id="filter-status" onchange="renderList()">
            <option value="">すべて</option><option value="未完了">未完了</option><option value="完了">完了</option>
          </select>
        </div>
        <div class="form-group"><label>日付（から）</label><input type="date" id="filter-from" onchange="renderList()"></div>
        <div class="form-group"><label>日付（まで）</label><input type="date" id="filter-to" onchange="renderList()"></div>
        <div class="form-group"><label>番号・内容検索</label><input type="text" id="filter-keyword" placeholder="キーワード" oninput="renderList()"></div>
        <button class="btn btn-sm" style="background:#e2e8f0;color:#4a5568;align-self:flex-end;" onclick="clearFilters()">クリア</button>
        <button class="btn btn-sm btn-primary" style="align-self:flex-end;" onclick="loadAll()">🔄 更新</button>
        <button class="btn btn-sm btn-success" style="align-self:flex-end;" onclick="exportExcel()">📥 Excel出力</button>
      </div>
    </div>
    <div style="margin-bottom:12px;"><span id="result-count" class="count-badge"></span></div>
    <div id="feedback-list" class="feedback-grid"><div class="loading"><div class="spinner"></div><br>読み込み中...</div></div>
  </div>

  <!-- 入力 -->
  <div id="tab-input" style="display:none">
    <div class="card">
      <h2>➕ フィードバック入力</h2>
      <div class="form-grid">
        <div class="form-group"><label>番号 *</label><input type="text" id="in-num" placeholder="例: FB-001"></div>
        <div class="form-group"><label>日付 *</label><input type="date" id="in-date"></div>
        <div class="form-group"><label>拠点 *</label><select id="in-base"><option value="">選択してください</option></select></div>
        <div class="form-group"><label>対応者</label><input type="text" id="in-person" placeholder="例: 田中 太郎"></div>
        <div class="form-group"><label>ステータス</label>
          <select id="in-status"><option value="未完了">未完了</option><option value="完了">完了</option></select>
        </div>
        <div class="form-group full"><label>内容 *</label><textarea id="in-content" placeholder="フィードバックの内容を入力してください"></textarea></div>
        <div class="form-group full"><label>画像（複数選択可）</label><input type="file" id="in-img" accept="image/*" multiple onchange="previewImgs(this)"></div>
        <div class="form-group full" id="img-preview-wrap" style="display:none">
          <label>画像プレビュー</label>
          <div id="img-preview-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;"></div>
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="save-btn" onclick="saveFeedback()">💾 保存</button>
        <button class="btn" style="background:#e2e8f0;color:#4a5568;" onclick="resetForm()">リセット</button>
      </div>
    </div>
  </div>

  <!-- 拠点設定 -->
  <div id="tab-settings" style="display:none">
    <div class="card">
      <h2>⚙️ 拠点の管理</h2>
      <div class="add-base-row">
        <input type="text" id="new-base-name" placeholder="新しい拠点名を入力" style="flex:1;">
        <button class="btn btn-success" onclick="addBase()">追加</button>
      </div>
      <div class="base-list" id="base-list"></div>
    </div>
  </div>

  <!-- 拠点別 -->
  <div id="tab-base" style="display:none">
    <div class="card">
      <h2 id="base-tab-title">🏢 拠点別フィードバック</h2>
      <div class="filter-row">
        <div class="form-group"><label>ステータス</label>
          <select id="bf-status" onchange="renderBaseList()">
            <option value="">すべて</option><option value="未完了">未完了</option><option value="完了">完了</option>
          </select>
        </div>
        <div class="form-group"><label>対応者</label><select id="bf-person" onchange="renderBaseList()"><option value="">すべて</option></select></div>
        <div class="form-group"><label>日付（から）</label><input type="date" id="bf-from" onchange="renderBaseList()"></div>
        <div class="form-group"><label>日付（まで）</label><input type="date" id="bf-to" onchange="renderBaseList()"></div>
        <div class="form-group"><label>キーワード</label><input type="text" id="bf-kw" placeholder="番号・内容" oninput="renderBaseList()"></div>
        <button class="btn btn-sm" style="background:#e2e8f0;color:#4a5568;align-self:flex-end;" onclick="clearBaseFilters()">クリア</button>
      </div>
    </div>
    <div style="margin-bottom:12px;"><span id="base-result-count" class="count-badge"></span></div>
    <div id="base-feedback-list" class="feedback-grid"></div>
  </div>

  <!-- 管理者 -->
  <div id="tab-admin" style="display:none">
    <div id="admin-lock">
      <div class="pw-box">
        <div class="lock-icon">🔐</div>
        <h2>管理者専用エリア</h2>
        <p style="color:#718096;font-size:.9rem;margin-bottom:16px;">パスワードを入力してください</p>
        <input type="password" id="admin-pw" placeholder="パスワード" style="margin-bottom:10px;" onkeydown="if(event.key==='Enter')checkPw()">
        <br>
        <button class="btn btn-warning" onclick="checkPw()">ログイン</button>
        <p id="pw-error" style="color:#e53e3e;font-size:.85rem;margin-top:8px;display:none;">パスワードが違います</p>
      </div>
    </div>
    <div id="admin-content" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-size:1.1rem;font-weight:700;color:#c05621;">📊 統計ダッシュボード</h2>
        <button class="btn btn-sm" style="background:#e2e8f0;color:#4a5568;" onclick="lockAdmin()">🔒 ロック</button>
      </div>
      <div class="stat-grid" id="stat-cards"></div>

      <!-- ====== マニュアル管理 ====== -->
      <div class="card" style="margin-bottom:20px; border-left: 4px solid #4299e1;">
        <h2 style="color:#2b6cb0; border-bottom-color:#ebf4ff;">📖 マニュアル管理</h2>
        <p style="font-size:.85rem;color:#718096;margin-bottom:14px;">ヘッダーの「マニュアル」ボタンに表示されるリンクを管理します。</p>
        <div class="add-manual-row">
          <input type="text" id="new-manual-title" placeholder="タイトル（例: 操作マニュアル）">
          <input type="url" id="new-manual-url" placeholder="URL（例: https://example.com/manual.pdf）">
          <button class="btn btn-success" onclick="addManual()">追加</button>
        </div>
        <div class="manual-admin-list" id="manual-admin-list">
          <div class="loading"><div class="spinner"></div><br>読み込み中...</div>
        </div>
      </div>

      <div class="card" id="usage-card" style="margin-bottom:20px;">
        <h2 class="admin" style="color:#c05621;border-bottom-color:#feebc8;">☁️ Supabase 使用量</h2>
        <div id="usage-content"><div class="loading"><div class="spinner"></div><br>使用量を取得中...</div></div>
      </div>
      <div class="chart-grid">
        <div class="chart-box"><h3>👤 対応者別 件数</h3><canvas id="chart-person"></canvas></div>
        <div class="chart-box"><h3>✅ ステータス別 件数</h3><canvas id="chart-status"></canvas></div>
        <div class="chart-box"><h3>🏢 拠点別 件数</h3><canvas id="chart-base"></canvas></div>
        <div class="chart-box"><h3>📅 日付別 件数（直近30日）</h3><canvas id="chart-date"></canvas></div>
      </div>
    </div>
  </div>
</div>

<div class="img-modal" id="img-modal" onclick="closeModal()">
  <span class="img-modal-close">✕</span>
  <img id="modal-img" src="" alt="">
</div>
<div class="toast" id="toast"></div>

<script>
var SB_URL = 'https://kcahlszfdjwhkflspycq.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjYWhsc3pmZGp3aGtmbHNweWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTYxMTgsImV4cCI6MjA5NDczMjExOH0.sSBc8zUjp-lGQ_i7JucKV9dQwr7_Lwz-XMBFWmdKW-Y';
var ADMIN_PW = 'agekke8206';
var HEADERS = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

var feedbacks = [], bases = [], manuals = [], editId = null, charts = {}, currentBase = '';
window._pendingImgs = [];

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, d) { d = d||2500; var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); }, d); }

function sbGet(table, params) {
  params = params||'';
  return fetch(SB_URL+'/rest/v1/'+table+'?'+params, { headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}) }).then(function(r){ return r.json(); });
}
function sbPost(table, body) {
  return fetch(SB_URL+'/rest/v1/'+table, { method:'POST', headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}), body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}
function sbPatch(table, id, body) {
  return fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id, { method:'PATCH', headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}), body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}
function sbDelete(table, id) {
  return fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id, { method:'DELETE', headers: HEADERS });
}
function uploadImage(base64, filename) {
  return fetch(base64).then(function(r){ return r.blob(); }).then(function(blob) {
    var path = Date.now()+'_'+filename;
    return fetch(SB_URL+'/storage/v1/object/feedback-images/'+path, {
      method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':blob.type }, body:blob
    }).then(function(res) {
      if(!res.ok) throw new Error('画像アップロード失敗');
      return SB_URL+'/storage/v1/object/public/feedback-images/'+path;
    });
  });
}

// ===== マニュアル =====
function loadManuals() {
  return sbGet('manuals', 'order=id.asc').then(function(data) {
    manuals = Array.isArray(data) ? data : [];
    renderManualDropdown();
  }).catch(function() {
    // テーブルが存在しない場合など、エラーは無視してドロップダウンを空で表示
    manuals = [];
    renderManualDropdown();
  });
}

function renderManualDropdown() {

function renderManualAdminList() {
  var el = document.getElementById('manual-admin-list');

function addManual() {
  var title = document.getElementById('new-manual-title').value.trim();
  var url = document.getElementById('new-manual-url').value.trim();
  if(!title) return alert('タイトルを入力してください');
  if(!url) return alert('URLを入力してください');
  if(!/^https?:\/\//.test(url)) return alert('URLは http:// または https:// から始めてください');
  sbPost('manuals', { title: title, url: url }).then(function(data) {
    if(Array.isArray(data) && data[0]) {
      manuals.push(data[0]);
    } else {
      // fallback: 再ロード
      return loadManuals().then(function(){ renderManualAdminList(); return; });
    }
    document.getElementById('new-manual-title').value = '';
    document.getElementById('new-manual-url').value = '';
    renderManualDropdown();
    renderManualAdminList();
    toast('📖 マニュアルを追加しました');
  }).catch(function() {
    alert('追加に失敗しました。Supabaseの manuals テーブルが存在するか確認してください。');
  });
}

function deleteManual(id) {
  if(!confirm('このマニュアルを削除しますか？')) return;
  sbDelete('manuals', id).then(function() {
    manuals = manuals.filter(function(m){ return m.id !== id; });
    renderManualDropdown();
    renderManualAdminList();
    toast('🗑️ マニュアルを削除しました');
  });
}

function toggleManualDropdown(e) {

}

document.addEventListener('click', function() {

// ===== フィードバック =====
function loadAll() {
  document.getElementById('feedback-list').innerHTML = '<div class="loading"><div class="spinner"></div><br>読み込み中...</div>';
  return Promise.all([
    sbGet('feedbacks','order=date.desc'),
    sbGet('bases','order=id.asc'),
    loadManuals()
  ]).then(function(results) {
    var fbData = results[0], baseData = results[1];
    feedbacks = (fbData||[]).map(function(f) { return Object.assign({}, f, { imgs: f.imgs ? JSON.parse(f.imgs) : [], status: f.status||'未完了' }); });
    bases = (baseData||[]).map(function(b) { return b.name; });
    refreshBaseSelects();
    refreshPersonFilter();
    refreshBaseTabs();
    renderList();
  }).catch(function() {
    document.getElementById('feedback-list').innerHTML = '<div class="empty">⚠️ データの読み込みに失敗しました。</div>';
  });
}

function refreshBaseSelects() {
  var opts = '<option value="">選択してください</option>' + bases.map(function(b){ return '<option value="'+esc(b)+'">'+esc(b)+'</option>'; }).join('');
  document.getElementById('in-base').innerHTML = opts;
  var fOpts = '<option value="">すべて</option>' + bases.map(function(b){ return '<option value="'+esc(b)+'">'+esc(b)+'</option>'; }).join('');
  document.getElementById('filter-base').innerHTML = fOpts;
}

function refreshPersonFilter() {
  var persons = [];
  feedbacks.forEach(function(f) { if(f.person && persons.indexOf(f.person)===-1) persons.push(f.person); });
  persons.sort();
  var el = document.getElementById('filter-person');
  var cur = el.value;
  el.innerHTML = '<option value="">すべて</option>' + persons.map(function(p){ return '<option value="'+esc(p)+'">'+esc(p)+'</option>'; }).join('');
  if(cur) el.value = cur;
}

function refreshBaseTabs() {
  var el = document.getElementById('base-tabs');
  el.innerHTML = bases.map(function(b) {
    return '<button class="tab base-tab" onclick="showBaseTab(\''+b.replace(/'/g,"\\'")+'\')" id="btab-'+encodeURIComponent(b)+'">🏢 '+esc(b)+'</button>';
  }).join('');
}

function renderBases() {
  var el = document.getElementById('base-list');
  if(!bases.length) { el.innerHTML = '<span style="color:#a0aec0;font-size:.85rem;">拠点が登録されていません</span>'; return; }
  el.innerHTML = bases.map(function(b, i) {
    return '<div class="base-tag"><span>'+esc(b)+'</span><button class="btn btn-danger" style="padding:2px 8px;font-size:.75rem;" onclick="removeBase('+i+')">削除</button></div>';
  }).join('');
}

function addBase() {
  var v = document.getElementById('new-base-name').value.trim();
  if(!v) return alert('拠点名を入力してください');
  if(bases.indexOf(v)!==-1) return alert('同じ名前の拠点がすでに存在します');
  sbPost('bases', { name: v }).then(function() {
    bases.push(v);
    document.getElementById('new-base-name').value = '';
    renderBases(); refreshBaseSelects(); refreshBaseTabs();
    toast('拠点を追加しました');
  });
}

function removeBase(i) {
  if(!confirm('「'+bases[i]+'」を削除しますか？')) return;
  var name = bases[i];
  sbGet('bases', 'name=eq.'+encodeURIComponent(name)).then(function(data) {
    if(data && data[0]) return sbDelete('bases', data[0].id);
  }).then(function() {
    bases.splice(i, 1);
    renderBases(); refreshBaseSelects(); refreshBaseTabs();
    toast('拠点を削除しました');

function makeFbCard(f) {
  return '<div class="fb-card '+(f.status==='完了'?'done':'')+'">'
    +'<div class="fb-card-header"><span class="fb-num"># '+esc(f.num)+'</span><span class="fb-date">'+f.date+'</span></div>'
    +'<div class="fb-card-body">'
    +'<span class="fb-base">'+esc(f.base)+'</span>'
    +(f.person?'<span style="display:inline-block;background:#e9d8fd;color:#553c9a;border-radius:4px;font-size:.75rem;padding:2px 8px;margin-left:4px;margin-bottom:8px;">👤 '+esc(f.person)+'</span>':'')
    +'<span onclick="toggleStatus(\''+f.id+'\')" style="display:inline-block;cursor:pointer;border-radius:4px;font-size:.75rem;padding:2px 8px;margin-left:4px;margin-bottom:8px;background:'+(f.status==='完了'?'#c6f6d5':'#fed7d7')+';color:'+(f.status==='完了'?'#276749':'#9b2c2c')+'">'+(f.status==='完了'?'✅ 完了':'⏳ 未完了')+'</span>'
    +'<div class="fb-content">'+esc(f.content)+'</div>'
    +(f.imgs&&f.imgs.length?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">'+f.imgs.map(function(img,i){ return '<img class="fb-img" src="'+img+'" alt="画像'+(i+1)+'" onclick="openModal(\''+f.id+'\','+i+')">'; }).join('')+'</div>':'')

    +'<button class="btn btn-sm" style="background:#ecc94b;color:#744210;" onclick="editFeedback(\''+f.id+'\')">✏️ 編集</button>'
    +'<button class="btn btn-sm btn-danger" onclick="deleteFeedback(\''+f.id+'\')">🗑️ 削除</button>'

function renderList() {
  var base=document.getElementById('filter-base').value;
  var person=document.getElementById('filter-person').value;
  var status=document.getElementById('filter-status').value;
  var from=document.getElementById('filter-from').value;
  var to=document.getElementById('filter-to').value;
  var kw=document.getElementById('filter-keyword').value.toLowerCase();
  var list = feedbacks.filter(function(f) {
    if(base && f.base!==base) return false;
    if(person && (f.person||'')!==person) return false;
    if(status && (f.status||'未完了')!==status) return false;
    if(from && f.date<from) return false;
    if(to && f.date>to) return false;
    if(kw && !(f.num.toLowerCase().includes(kw)||f.content.toLowerCase().includes(kw))) return false;
    return true;
  }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  document.getElementById('result-count').textContent = list.length+' 件';
  var el = document.getElementById('feedback-list');
  if(!list.length) { el.innerHTML='<div class="empty">📭 該当するフィードバックがありません</div>'; return; }
  el.innerHTML = list.map(makeFbCard).join('');
}

  document.getElementById('bf-from').value='';
  document.getElementById('bf-to').value='';

function saveFeedback() {
  var num=document.getElementById('in-num').value.trim();
  var date=document.getElementById('in-date').value;
  var base=document.getElementById('in-base').value;
  var content=document.getElementById('in-content').value.trim();
  if(!num||!date||!base||!content) return alert('番号・日付・拠点・内容は必須です');
  var person=document.getElementById('in-person').value.trim();
  var status=document.getElementById('in-status').value;
  var btn=document.getElementById('save-btn');
  btn.disabled=true;
  var imgs = window._pendingImgs.slice();
  var imgUrls = [];
  function uploadNext(i) {
    if(i>=imgs.length) return Promise.resolve();
    var src=imgs[i];
    if(src.startsWith('http')){ imgUrls.push(src); return uploadNext(i+1); }
    btn.textContent='画像アップロード中... ('+(i+1)+'/'+imgs.length+')';
    return uploadImage(src,'img'+i+'.jpg').then(function(url){ imgUrls.push(url); return uploadNext(i+1); });
  }
  uploadNext(0).then(function() {
    btn.textContent='保存中...';
    var payload={ num:num, date:date, base:base, person:person, content:content, status:status, imgs:JSON.stringify(imgUrls) };
    var p;
    if(editId!==null) {
      p = sbPatch('feedbacks', editId, payload).then(function() {
        var idx=feedbacks.findIndex(function(f){ return String(f.id)===String(editId); });
        if(idx>-1) feedbacks[idx]=Object.assign({},feedbacks[idx],payload,{imgs:imgUrls});
      });
    } else {
      var id=Date.now();
      p = sbPost('feedbacks', Object.assign({id:id},payload)).then(function() {
        feedbacks.unshift(Object.assign({id:id},payload,{imgs:imgUrls}));
      });
    }
    return p;
  }).then(function() {
    refreshPersonFilter();
    resetForm();
    toast('✅ 保存しました！');
    showTab('list');
  }).catch(function(e) {
    alert('保存に失敗しました。\n'+e.message);
  }).then(function() {
    btn.textContent='💾 保存'; btn.disabled=false;
  });
}

function deleteFeedback(id) {
  if(!confirm('このフィードバックを削除しますか？')) return;
  sbDelete('feedbacks', id).then(function() {
    feedbacks = feedbacks.filter(function(f){ return String(f.id)!==String(id); });
    refreshPersonFilter(); renderList();
    if(document.getElementById('tab-base').style.display!=='none') renderBaseList();
    toast('🗑️ 削除しました');
  });
}

function toggleStatus(id) {
  var f = feedbacks.find(function(f){ return String(f.id)===String(id); });
  if(!f) return;
  var newStatus = (f.status||'未完了')==='未完了'?'完了':'未完了';
  sbPatch('feedbacks', id, { status: newStatus }).then(function() {
    f.status=newStatus;
    renderList();
    if(document.getElementById('tab-base').style.display!=='none') renderBaseList();
    toast(newStatus==='完了'?'✅ 完了にしました':'⏳ 未完了に戻しました');
  });
}

function editFeedback(id) {
  var f = feedbacks.find(function(f){ return String(f.id)===String(id); });
  if(!f) return;
  showTab('input');
  setTimeout(function() {
    document.getElementById('in-num').value=f.num;
    document.getElementById('in-date').value=f.date;
    document.getElementById('in-base').value=f.base;
    document.getElementById('in-content').value=f.content;
    document.getElementById('in-person').value=f.person||'';
    document.getElementById('in-status').value=f.status||'未完了';
    window._pendingImgs=f.imgs?f.imgs.slice():[];
    var list=document.getElementById('img-preview-list');
    list.innerHTML='';
    (f.imgs||[]).forEach(function(img,i) {
      var div=document.createElement('div');
      div.style.cssText='position:relative;display:inline-block;';
      div.innerHTML='<img src="'+img+'" style="height:100px;border-radius:6px;object-fit:cover;"><button onclick="removePreviewImg('+i+',this.parentNode)" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;">✕</button>';
      list.appendChild(div);
    });
    if(f.imgs&&f.imgs.length) document.getElementById('img-preview-wrap').style.display='';
    editId=id;
  }, 50);
}

function resetForm() {
  ['in-num','in-date','in-content','in-person'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('in-base').value='';
  document.getElementById('in-status').value='未完了';
  document.getElementById('in-img').value='';
  document.getElementById('img-preview-list').innerHTML='';
  document.getElementById('img-preview-wrap').style.display='none';
  window._pendingImgs=[];
  editId=null;
  document.getElementById('in-date').value=new Date().toISOString().split('T')[0];
}

function previewImgs(input) {
  var files=Array.from(input.files);
  if(!files.length) return;
  document.getElementById('img-preview-wrap').style.display='';
  var list=document.getElementById('img-preview-list');
  files.forEach(function(file) {
    var reader=new FileReader();
    reader.onload=function(e) {
      window._pendingImgs.push(e.target.result);
      var idx=window._pendingImgs.length-1;
      var div=document.createElement('div');
      div.style.cssText='position:relative;display:inline-block;';
      div.innerHTML='<img src="'+e.target.result+'" style="height:100px;border-radius:6px;object-fit:cover;"><button onclick="removePreviewImg('+idx+',this.parentNode)" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;">✕</button>';
      list.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
}

function removePreviewImg(idx, el) {
  window._pendingImgs.splice(idx,1);
  el.remove();
  document.querySelectorAll('#img-preview-list button').forEach(function(btn,i){ btn.setAttribute('onclick','removePreviewImg('+i+',this.parentNode)'); });
}

function openModal(id, imgIdx) {
  imgIdx=imgIdx||0;
  var f=feedbacks.find(function(f){ return String(f.id)===String(id); });
  if(!f||!f.imgs||!f.imgs.length) return;
  document.getElementById('modal-img').src=f.imgs[imgIdx];
  document.getElementById('img-modal').classList.add('open');
}
function closeModal() { document.getElementById('img-modal').classList.remove('open'); }

function clearFilters() {
  ['filter-base','filter-person','filter-status','filter-from','filter-to','filter-keyword'].forEach(function(id){ document.getElementById(id).value=''; });
  renderList();
}

function exportExcel() {
  var base=document.getElementById('filter-base').value, person=document.getElementById('filter-person').value;
  var status=document.getElementById('filter-status').value, from=document.getElementById('filter-from').value;
  var to=document.getElementById('filter-to').value, kw=document.getElementById('filter-keyword').value.toLowerCase();
  var list=feedbacks.filter(function(f) {
    if(base&&f.base!==base)return false;
    if(person&&(f.person||'')!==person)return false;
    if(status&&(f.status||'未完了')!==status)return false;
    if(from&&f.date<from)return false;
    if(to&&f.date>to)return false;
    if(kw&&!(f.num.toLowerCase().includes(kw)||f.content.toLowerCase().includes(kw)))return false;
    return true;
  }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  if(!list.length) return alert('出力するデータがありません');
  var BOM='\uFEFF';
  var headers=['番号','日付','拠点','対応者','ステータス','内容','画像URL'];
  var rows=list.map(function(f) {
    return [f.num,f.date,f.base,f.person||'',f.status||'未完了',f.content.replace(/\n/g,' '),(f.imgs||[]).join(' | ')].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  });
  var csv=BOM+[headers.join(',')].concat(rows).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='フィードバック_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('📥 Excel出力しました');
}

function renderStats() {
  var total=feedbacks.length;
  var done=feedbacks.filter(function(f){ return f.status==='完了'; }).length;
  var undone=total-done;
  var persons=[];
  feedbacks.forEach(function(f){ if(f.person && persons.indexOf(f.person)===-1) persons.push(f.person); });
  document.getElementById('stat-cards').innerHTML =
    '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">総件数</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:#38a169">'+done+'</div><div class="stat-label">完了件数</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:#e53e3e">'+undone+'</div><div class="stat-label">未完了件数</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:#805ad5">'+persons.length+'</div><div class="stat-label">対応者数</div></div>';
  renderUsage();
  var colors=['#2b6cb0','#38a169','#c05621','#805ad5','#d69e2e','#e53e3e','#319795','#dd6b20'];
  var personCounts={};
  feedbacks.forEach(function(f){ var p=f.person||'未設定'; personCounts[p]=(personCounts[p]||0)+1; });
  renderChart('chart-person','bar',Object.keys(personCounts),Object.values(personCounts),colors);
  renderChart('chart-status','doughnut',['完了','未完了'],[done,undone],['#38a169','#e53e3e']);
  var baseCounts={};
  feedbacks.forEach(function(f){ baseCounts[f.base]=(baseCounts[f.base]||0)+1; });
  renderChart('chart-base','bar',Object.keys(baseCounts),Object.values(baseCounts),colors);
  var today=new Date(), dateMap={};
  for(var i=29;i>=0;i--){ var d=new Date(today); d.setDate(d.getDate()-i); dateMap[d.toISOString().slice(0,10)]=0; }
  feedbacks.forEach(function(f){ if(dateMap[f.date]!==undefined) dateMap[f.date]++; });
  renderChart('chart-date','line',Object.keys(dateMap),Object.values(dateMap),['#2b6cb0']);
}

function renderUsage() {
  var rowCount = feedbacks.length;
  var textBytes = feedbacks.reduce(function(acc, f) {
    return acc + (f.num||'').length + (f.date||'').length + (f.base||'').length
      + (f.person||'').length + (f.content||'').length + (f.status||'').length;
  }, 0);
  var dbEstimateKB = Math.round(textBytes / 1024 * 10) / 10;
  var dbLimitMB = 500;
  var dbPct = Math.min(100, Math.round(dbEstimateKB / (dbLimitMB * 1024) * 100 * 10) / 10);

  function bar(pct, color) {
    return '<div style="background:#e2e8f0;border-radius:20px;height:10px;margin:6px 0 2px;">'
      +'<div style="background:'+color+';border-radius:20px;height:10px;width:'+pct+'%;transition:width .5s;"></div></div>';
  }
  function colorFor(pct) { return pct < 60 ? '#38a169' : pct < 85 ? '#d69e2e' : '#e53e3e'; }

  var allImgs = [];
  feedbacks.forEach(function(f) { (f.imgs||[]).forEach(function(url){ if(url) allImgs.push(url); }); });
  var imgCount = allImgs.length;

  document.getElementById('usage-content').innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">'
    +'<div style="background:#f7fafc;border-radius:8px;padding:14px;">'
    +'<div style="font-weight:700;font-size:.9rem;color:#2d3748;margin-bottom:4px;">🗄️ データベース</div>'
    +'<div style="font-size:.82rem;color:#718096;">フィードバック件数：<b style="color:#2d3748;">'+rowCount+' 件</b></div>'
    +'<div style="font-size:.82rem;color:#718096;">テキストデータ概算：<b style="color:#2d3748;">'+dbEstimateKB+' KB</b></div>'
    +bar(dbPct, colorFor(dbPct))
    +'<div style="font-size:.78rem;color:#a0aec0;">上限 '+dbLimitMB+' MB のうち約 '+dbPct+'% 使用</div>'
    +'</div>'
    +'<div style="background:#f7fafc;border-radius:8px;padding:14px;" id="storage-box">'
    +'<div style="font-weight:700;font-size:.9rem;color:#2d3748;margin-bottom:4px;">🖼️ ストレージ（画像）</div>'
    +'<div style="font-size:.82rem;color:#718096;">添付画像数：<b style="color:#2d3748;">'+imgCount+' 枚</b></div>'
    +'<div style="font-size:.82rem;color:#718096;" id="storage-size">📡 画像サイズ取得中...</div>'
    +'<div id="storage-bar"></div>'
    +'<div style="font-size:.78rem;color:#a0aec0;" id="storage-pct"></div>'
    +'</div>'
    +'<div style="grid-column:1/-1;background:#ebf8ff;border-radius:8px;padding:12px;font-size:.82rem;color:#2c5282;">'
    +'📋 <b>Supabase 無料枠</b>：DB 500MB ／ ストレージ 1GB ／ 月間アクセス 50,000件'
    +'</div>'
    +'</div>';

  var totalBytes = 0;
  var done = 0;
  if(imgCount === 0) {
    document.getElementById('storage-size').innerHTML = '使用量：<b style="color:#2d3748;">0 KB</b>';
    document.getElementById('storage-bar').innerHTML = bar(0, '#38a169');
    document.getElementById('storage-pct').textContent = '上限 1 GB のうち 0% 使用';
    return;
  }
  allImgs.forEach(function(url) {
    fetch(url, { method: 'HEAD' }).then(function(res) {
      var len = parseInt(res.headers.get('content-length')||'0', 10);
      totalBytes += len;
    }).catch(function() {}).then(function() {
      done++;
      if(done === imgCount) {
        var storageMB = Math.round(totalBytes / 1024 / 1024 * 100) / 100;
        var storageKB = Math.round(totalBytes / 1024 * 10) / 10;
        var displaySize = storageMB >= 1 ? storageMB+' MB' : storageKB+' KB';
        var storageLimitMB = 1024;
        var storagePct = Math.min(100, Math.round(storageMB / storageLimitMB * 100 * 100) / 100);
        document.getElementById('storage-size').innerHTML = '使用量：<b style="color:#2d3748;">'+displaySize+'</b>（'+imgCount+' 枚合計）';
        document.getElementById('storage-bar').innerHTML = bar(storagePct, colorFor(storagePct));
        document.getElementById('storage-pct').textContent = '上限 1 GB のうち '+storagePct+'% 使用';
      }
    });
  });
}

function renderChart(id, type, labels, data, colors) {
  if(charts[id]) charts[id].destroy();
  var ctx=document.getElementById(id).getContext('2d');
  charts[id]=new Chart(ctx, {
    type:type,
    data:{ labels:labels, datasets:[{ data:data, backgroundColor:type==='line'?'rgba(43,108,176,.15)':colors, borderColor:type==='line'?'#2b6cb0':colors, borderWidth:type==='line'?2:1, fill:type==='line', tension:.3, pointRadius:type==='line'?3:undefined }] },
    options:{ responsive:true, plugins:{ legend:{ display:type==='doughnut' } }, scales:type!=='doughnut'?{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } }:{} }
  });
}

function showTab(t) {
  ['list','input','settings','admin','base'].forEach(function(id){ document.getElementById('tab-'+id).style.display=id===t?'':'none'; });
  document.querySelectorAll('#main-tabs .tab').forEach(function(el,i){ el.classList.toggle('active',['list','input','settings','admin'][i]===t); });
  document.querySelectorAll('#base-tabs .tab').forEach(function(el){ el.classList.remove('active'); });
  if(t==='settings') renderBases();
  if(t==='input') refreshBaseSelects();
}

document.getElementById('in-date').value=new Date().toISOString().split('T')[0];
loadAll();
</script>
